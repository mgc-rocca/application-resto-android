name: Android CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test, lint and assemble debug/release APKs
        run: |
          if ! ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease assembleDebugAndroidTest --stacktrace --no-daemon > build-verification.log 2>&1; then
            rg -n -m 30 '^e:|What went wrong|^> |^FAILURE|requires' build-verification.log || true
            tail -n 60 build-verification.log
            exit 1
          fi
          tail -n 30 build-verification.log

      - name: Upload unit reports and Room schemas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-unit-reports-and-schemas
          path: |
            build-verification.log
            app/build/test-results/
            app/build/reports/tests/
            app/schemas/
          if-no-files-found: ignore

      - name: Upload lint report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  local-data-instrumentation:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM for Android emulator
        run: |
          sudo chmod 666 /dev/kvm
      - name: Verify Room migration and ZIP compatibility on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --stacktrace --no-daemon --max-workers=2
      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-local-data-tests
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
