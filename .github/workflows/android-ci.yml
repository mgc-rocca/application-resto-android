name: Android CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Test, lint and assemble debug/release APKs
        run: |
          if ! ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease assembleDebugAndroidTest --stacktrace --no-daemon > build-verification.log 2>&1; then
            grep -n -m 30 -E '^e:|^FAILURE|requires' build-verification.log || true
            grep -n -A 30 -m 1 'What went wrong' build-verification.log || true
            tail -n 60 build-verification.log
            exit 1
          fi
          tail -n 30 build-verification.log

      - name: Upload unit reports and Room schemas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-unit-reports-and-schemas
          path: |
            build-verification.log
            app/build/test-results/
            app/build/reports/tests/
            app/schemas/
          if-no-files-found: ignore

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore

  stable-v1-export:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
      - name: Prepare the exact stable V1 and its isolated export test
        run: |
          git fetch --depth=1 origin 3413bcc3d57a14771c00c9da83b8455701fcbf30
          git worktree add --detach ../resto-stable-v1 3413bcc3d57a14771c00c9da83b8455701fcbf30
          mkdir -p ../resto-stable-v1/app/src/androidTest/java/fr/martinrocca/resto/compatibility
          mkdir -p ../resto-stable-v1/app/src/androidTest/assets
          cp tools/compatibility/StableV1ExportTest.kt ../resto-stable-v1/app/src/androidTest/java/fr/martinrocca/resto/compatibility/
          cp app/src/androidTest/assets/resto-v1-fixture.zip ../resto-stable-v1/app/src/androidTest/assets/
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Export reference ZIP and database with the V1 APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          script: bash tools/compatibility/export-stable-v1.sh
      - name: Upload V1 reference data and provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stable-v1-reference
          path: build/compatibility/
          if-no-files-found: ignore

  local-data-instrumentation:
    needs: [verify, stable-v1-export]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
      - name: Use ZIP and database exported by the stable V1
        uses: actions/download-artifact@v8.0.2
        with:
          name: stable-v1-reference
          path: build/compatibility/
      - name: Install the two verified V1 fixtures
        run: |
          cp build/compatibility/resto-stable-v1.zip app/src/androidTest/assets/
          cp build/compatibility/resto-stable-v1.db app/src/androidTest/assets/
      - name: Enable KVM for Android emulator
        run: |
          sudo chmod 666 /dev/kvm
      - name: Verify Room migration and ZIP compatibility on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --stacktrace --no-daemon --max-workers=2
      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-local-data-tests
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
